server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 100k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript application/xml;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location = /metrics {
        allow 172.30.0.0/24;
        deny all;
        proxy_pass http://api:3000/metrics;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /grafana/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/ {
        proxy_pass http://api:3000;
        include /etc/nginx/conf.d/proxy_params;
    }

    location / {
        return 404;
    }
}